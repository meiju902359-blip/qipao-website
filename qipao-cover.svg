<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">旗袍雅集淡豆沙色封面插畫</title><desc id="desc">淡豆沙色東方精品店，左側穿花卉旗袍的女性，右側展示旗袍人台。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8e6e1"/><stop offset=".52" stop-color="#fff8f1"/><stop offset="1" stop-color="#e8c6bd"/></linearGradient>
 <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99b9c"/><stop offset="1" stop-color="#a84f5b"/></linearGradient>
 <linearGradient id="shop" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2d6ca"/><stop offset="1" stop-color="#c99a85"/></linearGradient>
 <pattern id="flowers" width="82" height="82" patternUnits="userSpaceOnUse"><g fill="#f9e4df" stroke="#c97b7d" stroke-width="1.5" opacity=".8"><ellipse cx="24" cy="20" rx="7" ry="13"/><ellipse cx="24" cy="20" rx="7" ry="13" transform="rotate(72 24 20)"/><ellipse cx="24" cy="20" rx="7" ry="13" transform="rotate(144 24 20)"/><ellipse cx="24" cy="20" rx="7" ry="13" transform="rotate(216 24 20)"/><ellipse cx="24" cy="20" rx="7" ry="13" transform="rotate(288 24 20)"/><circle cx="24" cy="20" r="4" fill="#c97b7d"/></g></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#75484b" flood-opacity=".18"/></filter>
</defs>
<rect width="1500" height="900" fill="url(#bg)"/>
